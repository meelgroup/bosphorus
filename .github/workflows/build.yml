name: build

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "*" ]

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-14, macos-15-intel]
        build_type: [Release]
        staticcompile: [ON, OFF]

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: 'true'

    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install lit for the test suite
      run: pip install lit

    - name: Install dependencies for Linux
      if: contains(matrix.os, 'ubuntu')
      run: |
        sudo apt-get update
        sudo apt-get install -yq build-essential cmake pkg-config \
          libgmp-dev zlib1g-dev libboost-dev libboost-test-dev

    - name: Install dependencies for Mac
      if: contains(matrix.os, 'macos')
      run: brew install automake libtool boost pkg-config gmp

    - name: Build dependencies
      uses: ./.github/actions/build-deps
      with:
        static: ${{ matrix.staticcompile }}

    - name: Set up ccache
      uses: hendrikmuhs/ccache-action@v1
      with:
        key: ${{ matrix.os }}-${{ matrix.build_type }}-${{ matrix.staticcompile }}

    - name: Configure & build
      run: |
        mkdir -p build && cd build
        cmake \
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
          -DSTATICCOMPILE=${{ matrix.staticcompile }} \
          -DENABLE_TESTING=ON \
          -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
          ..
        cmake --build . --config ${{ matrix.build_type }}

    - name: Run it to check it executes
      run: |
        ./build/bosphorus --version
        ./build/bosphorus --help | grep -q -- --anfread

    - name: Smoke-test the binary on a real problem
      run: |
        printf 'x1 + x2 + x3\nx2 + x3 + 1\n' > smoke.anf
        ./build/bosphorus --anfread smoke.anf --solve --verb 0 | tee smoke.out
        grep -q "^s ANF-SATISFIABLE" smoke.out
        gzip -c smoke.anf > smoke.anf.gz
        ./build/bosphorus smoke.anf.gz --verb 0 | tee smoke-gz.out
        grep -q "^s ANF-SATISFIABLE" smoke-gz.out
        ./build/bosphorus smoke.anf.gz smoke.cnf --verb 0
        grep -q "^p cnf" smoke.cnf

    - name: Test
      run: ctest -C ${{ matrix.build_type }} --verbose
      working-directory: build

    - name: Upload Artifact
      if: matrix.staticcompile == 'ON'
      uses: actions/upload-artifact@v4
      with:
        name: bosphorus-${{ matrix.os }}
        path: build/bosphorus
