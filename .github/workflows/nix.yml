name: nix build

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "*" ]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: cachix/install-nix-action@v31
      with:
        install_url: https://releases.nixos.org/nix/nix-2.26.3/install
        nix_path: nixpkgs=channel:nixos-unstable
    - run: nix build

    - name: Run it to check it executes
      run: |
        ./result/bin/bosphorus --version
        ./result/bin/bosphorus --help | grep -q -- --anfread
        printf 'x1 + x2 + x3\nx2 + x3 + 1\n' > smoke.anf
        ./result/bin/bosphorus --anfread smoke.anf --solve --verb 0 | tee smoke.out
        grep -q "^s ANF-SATISFIABLE" smoke.out
